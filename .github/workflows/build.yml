name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and run tests
        run: mvn --batch-mode verify
      - name: Upload runnable JAR
        uses: actions/upload-artifact@v4
        with:
          name: healthfirst-pims
          path: target/healthfirst-pims.jar
          if-no-files-found: error
          retention-days: 30

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build installer
        shell: pwsh
        run: |
          mvn --batch-mode clean package
          ./scripts/build-windows.ps1
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: healthfirst-pims-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30